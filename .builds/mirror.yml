image: alpine/edge
secrets:
  - 0226e99e-651c-48d2-abc8-958a1ae61661
  #- 679413a7-cfcb-447d-93a0-2551d3917ddc
environment:
  REPO: caseos
  GH_USER: joeuint
  GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no
tasks:
  - push-to-github: |
      cd ~/"${REPO}"
      # Create local tracking branches for all remote branches
      for branch in $(git branch -r | grep -v '\->'); do
        git branch --track "${branch#origin/}" "$branch" || true
      done
      git branch
      git push --mirror "git@github.com:${GH_USER}/${REPO}"
